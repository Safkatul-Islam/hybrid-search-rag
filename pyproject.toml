[project]
name = "hybrid-rag"
version = "0.1.0"
description = "Hybrid Search RAG over internal documents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pypdf>=6.14.2",
    "langchain-text-splitters>=1.1.2",
    "cohere>=7.0.5",
    "rank-bm25>=0.2.2",
    "pinecone>=9.1.0",
    "anthropic>=0.116.0",
    "fastapi>=0.139.1",
    "uvicorn[standard]>=0.51.0",
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.0.0",
    "pip-audit>=2.9.0",
    "ruff>=0.15.21",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers are call-in-default by design, not B008 bugs.
extend-immutable-calls = ["fastapi.File", "fastapi.Depends", "fastapi.Query"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: live provider tests that require API keys (run with RUN_LIVE=1)",
]

[tool.coverage.run]
# Measure the package only; the tools under scripts/ are operator utilities,
# not serving code, and are exercised by running them rather than by tests.
source = ["src"]
omit = ["*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
